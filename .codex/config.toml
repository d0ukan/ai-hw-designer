# Optional Codex adapter. The shared project rules do not depend on this file.
# Use a model available in your client/account. Keep model names unset so
# task-specific routing and the user's selected provider remain flexible.
# model = "<available-economical-manager-model>"
model_reasoning_effort = "low"

[agents]
enabled = true
# Two specialist threads, excluding the primary Manager.
max_concurrent_threads_per_session = 2
# Override with a supported effort per task when appropriate.
default_subagent_reasoning_effort = "medium"
# default_subagent_model = "<available-standard-engineering-model>"
