name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate workflow state
        run: python scripts/projectctl.py validate
      - name: Repository consistency (rules, links, versions, CSV)
        run: python scripts/check_repo.py
      - name: Example project end-to-end
        shell: bash
        run: |
          E=examples/DR00001-usb-c-led
          A="--state $E/workflow-state.json --manufacturing-dir $E/Manufacturing"
          python scripts/projectctl.py validate $A
          python scripts/projectctl.py check-bom $A
          python scripts/projectctl.py check-release $A
          test "$(python scripts/projectctl.py name --variant A $A | tr -d '\r')" = "DR00001-AV-R01"
          python scripts/projectctl.py next $A | grep -q "nothing missing"
